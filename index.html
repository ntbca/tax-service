<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全功能櫃檯各項作業應備文件查詢系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 全局限制最小字體 14px */
    html, body {
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .text-min-14 {
      font-size: clamp(14px, 1.2vw, 16px);
    }
    /* 自訂捲軸 */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between" onclick="closeAllDropdowns()">

  <header class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white py-6 px-4 md:px-12 shadow-md w-full">
    <div class="w-full max-w-7xl mx-auto text-center md:text-left">
      <h1 class="text-xl md:text-3xl font-bold tracking-wide">全功能櫃檯各項作業應備文件查詢系統</h1>
      <p class="text-blue-200 text-sm md:text-base mt-1">中區國稅局彰化分局 × 彰化縣地方稅務局</p>
    </div>
  </header>

  <main class="flex-1 w-full max-w-[1920px] mx-auto p-4 md:p-8 flex flex-col justify-center items-center">

    <section id="step-1" class="w-full max-w-4xl text-center py-8">
      <h2 class="text-2xl md:text-4xl font-extrabold text-slate-800 mb-8">請點選欲查詢稅務類型</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-12 px-4">
        
        <button type="button" onclick="selectTaxType('national')" class="group relative bg-white border-2 border-blue-600 hover:bg-blue-600 rounded-2xl p-8 md:p-12 shadow-lg hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 flex flex-col items-center justify-center cursor-pointer">
          <div class="w-20 h-20 md:w-28 md:h-28 bg-blue-100 group-hover:bg-white text-blue-600 rounded-full flex items-center justify-center mb-4 transition-colors">
            <i class="fa-solid fa-building-columns text-4xl md:text-6xl"></i>
          </div>
          <span class="text-3xl md:text-5xl font-bold text-blue-900 group-hover:text-white transition-colors">國 稅</span>
          <span class="text-min-14 text-slate-500 group-hover:text-blue-100 mt-2">點擊檢索國稅服務項目</span>
        </button>

        <button type="button" onclick="selectTaxType('local')" class="group relative bg-white border-2 border-slate-300 hover:border-emerald-600 rounded-2xl p-8 md:p-12 shadow-md hover:shadow-lg transition-all duration-300 flex flex-col items-center justify-center cursor-pointer">
          <div class="w-20 h-20 md:w-28 md:h-28 bg-slate-100 text-slate-400 group-hover:bg-emerald-100 group-hover:text-emerald-600 rounded-full flex items-center justify-center mb-4 transition-colors">
            <i class="fa-solid fa-house-chimney text-4xl md:text-6xl"></i>
          </div>
          <span class="text-3xl md:text-5xl font-bold text-slate-500 group-hover:text-emerald-900 transition-colors">地 方 稅</span>
          <span class="text-min-14 text-slate-400 mt-2">（系統建置中）</span>
        </button>

      </div>
    </section>

    <section id="step-2" class="hidden w-full space-y-6">
      
      <div class="flex items-center justify-between border-b border-slate-300 pb-4">
        <button type="button" onclick="goBack()" class="flex items-center gap-2 bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-bold text-min-14 transition-all cursor-pointer">
          <i class="fa-solid fa-arrow-left"></i> 重選稅務類型
        </button>
        <div class="text-xl md:text-2xl font-bold text-blue-900">
          國稅服務項目
        </div>
      </div>

      <div class="relative w-full">
        <div class="relative flex items-center w-full">
          <span class="absolute left-4 text-blue-400 flex items-center pointer-events-none">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </span>

          <input 
            type="text" 
            id="searchInput" 
            oninput="handleSearchInput()" 
            onfocus="handleSearchInput()"
            placeholder="輸入關鍵書表或項目名稱 (如: 各稅核定資料、遺產稅延期申報、補發稅單...)" 
            class="w-full pl-11 pr-10 py-3 bg-white border-2 border-blue-400 rounded-2xl shadow-md focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-200 text-slate-800 text-sm md:text-base transition-all"
          >

          <button type="button" id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-4 text-slate-400 hover:text-slate-600 cursor-pointer">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <div id="searchDropdown" class="hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden z-50 max-h-96 overflow-y-auto custom-scrollbar">
          <ul id="searchResults" class="divide-y divide-slate-100">
            </ul>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
        
        <div class="bg-white rounded-xl shadow-md border border-blue-200 overflow-hidden flex flex-col">
          <div class="bg-blue-800 text-white p-4 text-center font-bold text-lg md:text-xl flex items-center justify-center gap-2">
            <i class="fa-solid fa-magnifying-glass"></i> 查詢作業項目清單
          </div>
          <div class="p-4 flex-1 divide-y divide-slate-100 space-y-1 overflow-y-auto max-h-[600px] custom-scrollbar">
            <a href="javascript:void(0)" onclick="selectItem('tax_history')" class="block p-3 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded transition-colors text-min-14 font-medium flex items-center justify-between gap-2">
              <span class="flex-1">1. 各稅核定資料</span>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xs bg-orange-100 text-orange-800 px-2 py-0.5 rounded font-bold">跨區局</span>
                <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
              </div>
            </a>
            <a href="javascript:void(0)" onclick="selectItem('tax_arrears')" class="block p-3 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded transition-colors text-min-14 font-medium flex items-center justify-between gap-2">
              <span class="flex-1">2. 納稅欠稅及退稅資料查詢</span>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xs bg-orange-100 text-orange-800 px-2 py-0.5 rounded font-bold">跨區局</span>
                <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
              </div>
            </a>
            <a href="javascript:void(0)" onclick="selectItem('income_list')" class="block p-3 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded transition-colors text-min-14 font-medium flex items-center justify-between gap-2">
              <span class="flex-1">3. 個人綜合所得稅各類所得資料清單查詢</span>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xs bg-orange-100 text-orange-800 px-2 py-0.5 rounded font-bold">跨區局</span>
                <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
              </div>
            </a>
            <a href="javascript:void(0)" onclick="selectItem('property_list')" class="block p-3 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded transition-colors text-min-14 font-medium flex items-center justify-between gap-2">
              <span class="flex-1">4. 個人財產歸戶資料查詢</span>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xs bg-orange-100 text-orange-800 px-2 py-0.5 rounded font-bold">跨區局</span>
                <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
              </div>
            </a>
            <a href="javascript:void(0)" onclick="selectItem('deceased_data')" class="block p-3 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded transition-colors text-min-14 font-medium flex items-center justify-between gap-2">
              <span class="flex-1">5. 被繼承人財產、所得及贈與資料查詢</span>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xs bg-orange-100 text-orange-800 px-2 py-0.5 rounded font-bold">跨區局</span>
                <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
              </div>
            </a>
            <a href="javascript:void(0)" onclick="selectItem('creditor_data')" class="block p-3 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded transition-colors text-min-14 font-medium flex items-center justify-between gap-2">
              <span class="flex-1">6. 債權人查調債務人課稅資料查詢</span>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xs bg-orange-100 text-orange-800 px-2 py-0.5 rounded font-bold">跨區局</span>
                <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
              </div>
            </a>
            <a href="javascript:void(0)" onclick="selectItem('tax_status')" class="block p-3 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded transition-colors text-min-14 font-medium flex items-center justify-between gap-2">
              <span class="flex-1">7. 綜合所得稅稅籍查詢</span>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xs bg-orange-100 text-orange-800 px-2 py-0.5 rounded font-bold">跨區局</span>
                <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
              </div>
            </a>
            <a href="javascript:void(0)" onclick="selectItem('small_business')" class="block p-3 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded transition-colors text-min-14 font-medium flex items-center justify-between gap-2">
              <span class="flex-1">8. 小規模營利事業營業額核定資料查詢</span>
              <div class="flex items-center gap-2 flex-shrink-0">
                <span class="text-xs bg-red-100 text-red-800 px-2 py-0.5 rounded font-bold">跨轄區</span>
                <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
              </div>
            </a>
            <a href="javascript:void(0)" onclick="selectItem('business_reg')" class="block p-3 hover:bg-blue-50 text-slate-700 hover:text-blue-700 rounded transition-colors text
